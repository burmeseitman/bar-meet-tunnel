services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PUBLIC_ADDR: ':8080'
      REDIS_URL: redis:6379
      CONTROL_ADDR: ':9000'
      CONTROL_TOKEN: ${CONTROL_TOKEN:?Set CONTROL_TOKEN in .env}
      AGENT_TOKENS: ${AGENT_TOKENS:?Set AGENT_TOKENS in .env}
      TRUSTED_PROXY_CIDRS: 172.30.0.2/32
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
      CAPTURE_MODE: ${CAPTURE_MODE:-metadata}
      CAPTURE_TTL: ${CAPTURE_TTL:-15m}
      REDACT_HEADERS: ${REDACT_HEADERS:-}
    networks:
      - tunnel

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tunnel

  nginx:
    image: nginx:alpine-slim@sha256:f761b94f2cb9e8e05e2943d5f773609596113ef69b54e2433a996d109a8f78b7
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - gateway
    networks:
      tunnel:
        ipv4_address: 172.30.0.2

networks:
  tunnel:
    ipam:
      config:
        - subnet: 172.30.0.0/24
